    text: {en: "The vehicle register holds, for each vehicle, objections to a transfer, declarations of seizure, pledges and suspensions.", fr: "Le système d’immatriculation des véhicules contient, pour chaque véhicule, les oppositions au transfert, les déclarations valant saisie, les gages et les suspensions."}
    status: same
    source: {title: "CNIL, SIV : système d’immatriculation des véhicules", url: "https://web.archive.org/web/20261003200905/https://www.cnil.fr/fr/siv-systeme-dimmatriculation-des-vehicules", archive: "https://web.archive.org/web/20261003200905/https://www.cnil.fr/fr/siv-systeme-dimmatriculation-des-vehicules"}
    last_checked: "2026-11-18"
  - id: REG-076
    text: {en: "The system traces every action of its users, and access to those traces is regulated.", fr: "Le système trace toutes les actions de ses utilisateurs, et l’accès à ces traces est réglementé."}
    status: same
    source: {title: "CNIL, SIV : système d’immatriculation des véhicules", url: "https://web.archive.org/web/20261003200905/https://www.cnil.fr/fr/siv-systeme-dimmatriculation-des-vehicules", archive: "https://web.archive.org/web/20261003200905/https://www.cnil.fr/fr/siv-systeme-dimmatriculation-des-vehicules"}
    last_checked: "2026-11-18"
