    text: {en: "Data on the holder and the vehicle stay five years from the physical destruction of the vehicle.", fr: "Les données sur le titulaire et le véhicule sont conservées cinq ans à compter de la destruction physique du véhicule."}
    status: same
    source: {title: "CNIL, SIV : système d’immatriculation des véhicules", url: "https://web.archive.org/web/20261003200905/https://www.cnil.fr/fr/siv-systeme-dimmatriculation-des-vehicules", archive: "https://web.archive.org/web/20261003200905/https://www.cnil.fr/fr/siv-systeme-dimmatriculation-des-vehicules"}
